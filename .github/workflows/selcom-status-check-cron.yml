name: Selcom payout status-check cron

# DISABLED (automatic schedule removed): BizLink Africa does not manage
# merchant settlement — payout creation/approval/submission is permanently
# blocked (see src/lib/archived-financial-prototype.ts,
# BIZLINK_MANAGES_MERCHANT_SETTLEMENTS), so no new payout can ever reach a
# 'submitted'/'processing'/'unknown' status that would need polling. This
# workflow, and the underlying route it calls
# (src/app/api/payouts/status-check-cron/route.ts), are read-only status
# checks — they never create a disbursement — and are kept reachable via
# manual dispatch only, for resolving the final status of any payout
# already in flight from before this change, or for historical/audit
# reconciliation. Re-enabling the schedule below would resume automatic
# polling; do not do so without a reason tied to actual in-flight records.
#
# Requires a repository secret named CRON_SECRET, set to the exact same
# value as the CRON_SECRET environment variable configured in Vercel's
# production environment (Project Settings → Environment Variables).

on:
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  status-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call status-check-cron route
        run: |
          http_status=$(curl -s -o /dev/null -w '%{http_code}' \
            --max-time 25 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://admin.bizlinkafrica.net/api/payouts/status-check-cron)
          echo "Response status: $http_status"
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "status-check-cron call failed with HTTP $http_status"
            exit 1
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
